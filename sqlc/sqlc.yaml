version: "2"
sql:
  - engine: "postgresql"
    queries:
      - queries.sql
    schema:
      - schema.sql
    strict_order_by: false
    gen:
      go:
        package: "sqlc"
        sql_package: "pgx/v5"
        out: "."
        emit_methods_with_db_argument: true
        emit_result_struct_pointers: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
